name: Terraform Deploy

on:
  push:
    branches:
      - main
  pull_request:

env:
  TF_VERSION: 1.6.6
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: Terraform CI/CD
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 🔐 AWS Authentication via OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Build Lambda ZIP from backend/ — must run before terraform plan
      # so fileexists() in lambda/main.tf returns true during plan
      - name: Build Lambda ZIP
        run: |
          cd backend
          npm install
          rm -f ../modules/lambda/lambda.zip
          zip -r ../modules/lambda/lambda.zip .

      # Pick environment (default: dev)
      - name: Select environment
        run: echo "ENV=dev" >> $GITHUB_ENV

      # -reconfigure forces re-initialisation of the backend on every run
      - name: Terraform Init
        working-directory: environments/${{ env.ENV }}
        run: terraform init -reconfigure

      - name: Terraform Format Check
        working-directory: environments/${{ env.ENV }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: environments/${{ env.ENV }}
        run: terraform validate

      # Shows all resources currently tracked in Terraform state
      - name: Terraform State List
        working-directory: environments/${{ env.ENV }}
        run: terraform state list

      - name: Terraform Plan
        working-directory: environments/${{ env.ENV }}
        env:
          TF_VAR_cf_key_pair_id: ${{ secrets.CF_KEY_PAIR_ID }}
          TF_VAR_cf_private_key: ${{ secrets.CF_PRIVATE_KEY }}
          TF_VAR_cf_key_group_id: ${{ secrets.CF_KEY_GROUP_ID }}
          TF_VAR_github_actions_role_name: ${{ secrets.GH_ACTIONS_ROLE_NAME }}
        run: terraform plan -out=tfplan

      # Apply only on main branch pushes — not on pull requests
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: environments/${{ env.ENV }}
        env:
          TF_VAR_cf_key_pair_id: ${{ secrets.CF_KEY_PAIR_ID }}
          TF_VAR_cf_private_key: ${{ secrets.CF_PRIVATE_KEY }}
          TF_VAR_cf_key_group_id: ${{ secrets.CF_KEY_GROUP_ID }}
          TF_VAR_github_actions_role_name: ${{ secrets.GH_ACTIONS_ROLE_NAME }}
        run: terraform apply -auto-approve tfplan

      # Inject the API endpoint into index.html then sync to the frontend S3 bucket
      - name: Deploy Frontend
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: environments/${{ env.ENV }}
        run: |
          API_ENDPOINT=$(terraform output -raw api_endpoint)
          FRONTEND_BUCKET=$(terraform output -raw frontend_bucket)
          FRONTEND_DIST_ID=$(terraform output -raw frontend_distribution_id)

          # Inject the API endpoint into the HTML so the browser knows where to call
          sed "s|window.API_ENDPOINT || \".*\"|\"${API_ENDPOINT}\"|g" \
            ../../frontend/index.html > /tmp/index.html

          # Upload to S3
          aws s3 cp /tmp/index.html s3://${FRONTEND_BUCKET}/index.html \
            --content-type "text/html" \
            --cache-control "no-cache"

          # Invalidate CloudFront cache so users get the latest version immediately
          aws cloudfront create-invalidation \
            --distribution-id ${FRONTEND_DIST_ID} \
            --paths "/*"
