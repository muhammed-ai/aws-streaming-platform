name: Terraform Deploy

on:
  push:
    branches:
      - main
  pull_request:

env:
  TF_VERSION: 1.6.6
  AWS_REGION: us-east-1

jobs:
  terraform:
    name: Terraform CI/CD
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 🔐 AWS Authentication via OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Build Lambda ZIP from backend/ before Terraform plan so the zip exists when plan runs
      - name: Build Lambda ZIP
        run: |
          cd backend
          npm install
          zip -r ../modules/lambda/lambda.zip .

      # Pick environment (default: dev)
      - name: Select environment
        run: echo "ENV=dev" >> $GITHUB_ENV

      # -reconfigure forces re-initialisation of the backend on every run
      - name: Terraform Init
        working-directory: environments/${{ env.ENV }}
        run: terraform init -reconfigure

      - name: Terraform Format Check
        working-directory: environments/${{ env.ENV }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: environments/${{ env.ENV }}
        run: terraform validate

      # Shows all resources currently tracked in Terraform state — helps debug missing resources
      - name: Terraform State List
        working-directory: environments/${{ env.ENV }}
        run: terraform state list

      - name: Terraform Plan
        working-directory: environments/${{ env.ENV }}
        run: terraform plan -out=tfplan

      # Apply only on main branch pushes — not on pull requests
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: environments/${{ env.ENV }}
        run: terraform apply -auto-approve tfplan
